<nav class="bg-blue-600 text-white shadow-md">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <a routerLink="/dashboard" class="text-xl font-bold">LMS</a>
    @if (authService.isAuthenticated()) {
      <div class="flex items-center gap-5">
        <a routerLink="/dashboard" routerLinkActive="underline" class="hover:text-blue-200 text-sm">Dashboard</a>
        <a routerLink="/courses" routerLinkActive="underline" class="hover:text-blue-200 text-sm">Cursos</a>
        @if (!authService.isAdmin()) {
          <a routerLink="/my-courses" routerLinkActive="underline" class="hover:text-blue-200 text-sm">Meus Cursos</a>
        }
        <span class="text-blue-200 text-sm">{{ authService.user()?.userName }}</span>
        <button (click)="logout()" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm">Sair</button>
      </div>
    }
  </div>
</nav>
